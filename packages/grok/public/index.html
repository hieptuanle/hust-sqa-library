<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Book Manager</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        form { margin-bottom: 20px; }
        input, button { margin: 5px; padding: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .logout { float: right; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Library Book Manager</h1>
        <button class="logout" onclick="logout()">Logout</button>

        <h2>Add New Book</h2>
        <form id="addBookForm">
            <input type="text" id="title" placeholder="Title" required>
            <input type="text" id="author" placeholder="Author" required>
            <input type="number" id="year" placeholder="Publication Year" required>
            <button type="submit">Add Book</button>
        </form>

        <h2>Search Books</h2>
        <input type="text" id="searchQuery" placeholder="Search...">
        <label><input type="radio" name="searchType" value="title" checked> Title</label>
        <label><input type="radio" name="searchType" value="author"> Author</label>
        <button onclick="searchBooks()">Search</button>
        <button onclick="loadBooks()">Show All</button>

        <h2>Books</h2>
        <table id="booksTable">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Year</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        async function loadBooks() {
            const response = await fetch('/api/books');
            const books = await response.json();
            displayBooks(books);
        }

        async function addBook(event) {
            event.preventDefault();
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            const year = parseInt(document.getElementById('year').value);

            const response = await fetch('/api/books', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, author, year })
            });

            if (response.ok) {
                document.getElementById('addBookForm').reset();
                loadBooks();
            } else {
                alert(await response.text());
            }
        }

        async function deleteBook(id) {
            if (confirm('Are you sure you want to delete this book?')) {
                const response = await fetch(`/api/books/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    loadBooks();
                } else {
                    alert(await response.text());
                }
            }
        }

        async function searchBooks() {
            const query = document.getElementById('searchQuery').value;
            const type = document.querySelector('input[name="searchType"]:checked').value;
            const response = await fetch(`/api/books/search?query=${encodeURIComponent(query)}&type=${type}`);
            const books = await response.json();
            displayBooks(books);
        }

        function displayBooks(books) {
            const tbody = document.querySelector('#booksTable tbody');
            tbody.innerHTML = '';
            books.forEach(book => {
                const row = tbody.insertRow();
                row.insertCell(0).textContent = book.title;
                row.insertCell(1).textContent = book.author;
                row.insertCell(2).textContent = book.year;
                const deleteCell = row.insertCell(3);
                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'Delete';
                deleteBtn.onclick = () => deleteBook(book.id);
                deleteCell.appendChild(deleteBtn);
            });
        }

        async function logout() {
            await fetch('/logout', { method: 'POST' });
            window.location.reload();
        }

        document.getElementById('addBookForm').addEventListener('submit', addBook);
        loadBooks();
    </script>
</body>
</html>
