<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Book Manager</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Library Book Manager</h1>
      <div id="userInfo" class="user-info"></div>
    </header>

    <main>
      <div id="authSection" class="auth-section">
        <div class="auth-forms">
          <div class="form-container">
            <h2>Login</h2>
            <form id="loginForm">
              <input type="text" id="loginUsername" placeholder="Username" required>
              <input type="password" id="loginPassword" placeholder="Password" required>
              <button type="submit">Login</button>
            </form>
          </div>

          <div class="form-container">
            <h2>Register</h2>
            <form id="registerForm">
              <input type="text" id="registerUsername" placeholder="Username" required>
              <input type="password" id="registerPassword" placeholder="Password" required>
              <button type="submit">Register</button>
            </form>
          </div>
        </div>
      </div>

      <div id="librarySection" class="library-section" style="display: none;">
        <div class="controls">
          <div class="add-book-form">
            <h2>Add New Book</h2>
            <form id="addBookForm">
              <input type="text" id="bookTitle" placeholder="Title" required>
              <input type="text" id="bookAuthor" placeholder="Author" required>
              <input type="number" id="bookYear" placeholder="Publication Year" min="1400" max="2025" required>
              <button type="submit">Add Book</button>
            </form>
          </div>

          <div class="search-container">
            <h2>Search Books</h2>
            <div class="search-controls">
              <input type="text" id="searchQuery" placeholder="Enter search term...">
              <div class="search-type">
                <label>
                  <input type="radio" name="searchType" value="title" checked>
                  Title
                </label>
                <label>
                  <input type="radio" name="searchType" value="author">
                  Author
                </label>
              </div>
              <button id="searchBtn">Search</button>
              <button id="clearSearchBtn">Clear</button>
            </div>
          </div>

          <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>

        <div class="books-container">
          <h2>Books Library</h2>
          <div id="booksTable"></div>
        </div>
      </div>
    </main>

    <div id="messageArea" class="message-area"></div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
