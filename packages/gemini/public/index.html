
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Book Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Library Book Manager</h1>

        <div id="auth-container">
            <div id="login-form">
                <h2>Login</h2>
                <input type="text" id="login-username" placeholder="Username" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button id="login-btn">Login</button>
                <p>Don't have an account? <a href="#" id="show-register">Register here</a></p>
            </div>

            <div id="register-form" style="display: none;">
                <h2>Register</h2>
                <input type="text" id="register-username" placeholder="Username" required>
                <input type="password" id="register-password" placeholder="Password" required>
                <button id="register-btn">Register</button>
                <p>Already have an account? <a href="#" id="show-login">Login here</a></p>
            </div>
        </div>

        <div id="library-container" style="display: none;">
            <div id="user-session">
                <p>Welcome, <span id="username-display"></span>!</p>
                <button id="logout-btn">Logout</button>
            </div>

            <h2>Add a New Book</h2>
            <form id="add-book-form">
                <input type="text" id="title" placeholder="Title" required>
                <input type="text" id="author" placeholder="Author" required>
                <input type="number" id="year" placeholder="Publication Year" required>
                <button type="submit">Add Book</button>
            </form>

            <h2>Search Books</h2>
            <div id="search-container">
                <input type="text" id="search-input" placeholder="Search...">
                <select id="search-by">
                    <option value="title">Title</option>
                    <option value="author">Author</option>
                </select>
                <button id="search-btn">Search</button>
            </div>

            <h2>Book List</h2>
            <table id="book-list">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Year</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Book rows will be inserted here -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
